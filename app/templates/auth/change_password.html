{% extends "base.html" %}
{% block title %}Change password · PD Compass{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <a href="{{ home }}" class="back-link"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back</a>
    <h1>Change password</h1>
    <p class="text-muted mb-0">At least 8 characters, with a letter and a number.</p>
  </div>
</div>

<div class="row">
  <div class="col-lg-6">
    <form method="post" class="card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="card-body">
        <div class="mb-4">
          <label for="current_password" class="form-label">Current password</label>
          <input id="current_password" type="password" name="current_password" class="form-control"
                 autocomplete="current-password" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">New password</label>
          <input id="password" type="password" name="password" class="form-control"
                 autocomplete="new-password" minlength="8" required>
        </div>
        <div class="mb-4">
          <label for="confirm_password" class="form-label">Type the new password again</label>
          <input id="confirm_password" type="password" name="confirm_password" class="form-control"
                 autocomplete="new-password" minlength="8" required>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg" aria-hidden="true"></i> Save new password</button>
          <a href="{{ home }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
