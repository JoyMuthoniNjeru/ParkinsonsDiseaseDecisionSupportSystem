{% extends "auth/split.html" %}
{% block title %}Choose a new password · PD Compass{% endblock %}
{% block panel %}
<h1 class="h2 mb-1">Choose a new password</h1>
<p class="text-muted mb-4">For {{ user.email }}. At least 8 characters, with a letter and a number.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label for="password" class="form-label">New password</label>
    <input id="password" type="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required>
  </div>
  <div class="mb-4">
    <label for="confirm_password" class="form-label">Type it again</label>
    <input id="confirm_password" type="password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="8" required>
  </div>
  <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-lg" aria-hidden="true"></i> Save new password</button>
</form>
<p class="mt-4 mb-0"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
{% endblock %}
