{% extends "base.html" %}
{% block title %}Log observation · PD Compass{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <a href="{{ url_for('caregiver.patient_dashboard', patient_id=patient.patient_id) }}" class="back-link">
      <i class="bi bi-arrow-left" aria-hidden="true"></i> {{ patient.name }}'s dashboard</a>
    <h1>Log an observation</h1>
    <p class="text-muted mb-0">What did you notice about {{ patient.name.split()[0] }} today? Their clinician can read this.</p>
  </div>
</div>

<div class="row">
  <div class="col-lg-8">
    <form method="post" class="card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="card-body">
        <div class="mb-4">
          <label for="note" class="form-label">Observation</label>
          <textarea id="note" name="note" rows="5" class="form-control" required
                    placeholder="e.g. Seemed more tired than usual and napped twice."></textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg" aria-hidden="true"></i> Save observation</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
