{% extends "base.html" %}
{% block nav %}
<header class="topnav">
  <div class="brand">PD Monitor <span class="role">Caregiver</span></div>
  <div>
    <a class="active" href="{{ url_for('caregiver.dashboard') }}">Linked patients</a>
    <a href="{{ url_for('caregiver.requests_') }}">Requests</a>
    <a href="{{ url_for('auth.logout') }}">Log out</a>
  </div>
</header>
{% endblock %}
{% block content %}
<h2>Log observation for {{ patient.name }}</h2>
<div class="card" style="max-width:420px;">
  <form method="post">
    <div class="field"><label>Observation notes</label><textarea name="note" rows="4" required></textarea></div>
    <button type="submit">Save observation</button>
  </form>
</div>
{% endblock %}
