{% extends "base.html" %}
{% block nav %}
<header class="topnav">
  <div class="brand">PD Monitor <span class="role">Clinician</span></div>
  <div>
    <a class="active" href="{{ url_for('hcp.dashboard') }}">Patients</a>
    <a href="{{ url_for('auth.logout') }}">Log out</a>
  </div>
</header>
{% endblock %}
{% block content %}
<h2>Assigned patients</h2>
<div class="card">
  <table>
    {% for p in patients %}
    <tr><td>{{ p.name }}</td>
        <td><a href="{{ url_for('hcp.patient_dashboard', patient_id=p.patient_id) }}">View dashboard</a></td></tr>
    {% else %}
    <tr><td>No patients assigned yet.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
