{% extends "auth/split.html" %}
{% block title %}Clinician application · PD Compass{% endblock %}
{% block panel %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <h1 class="h2 mb-1">Clinician application</h1>
        <div class="alert alert-warning d-flex gap-2" role="note">
          <i class="bi bi-hourglass-split" aria-hidden="true"></i>
          <div>An Admin reviews every application before you can log in.</div>
        </div>
        {% include "partials/register_fields.html" %}
        <div class="mb-4">
          <label for="institution" class="form-label">Institution</label>
          <input id="institution" name="institution" class="form-control" placeholder="e.g. Kenyatta National Hospital" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Submit application</button>
      </div>
    </form>
    <p class="text-center mt-3">Already approved? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
