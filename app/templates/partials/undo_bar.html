{# "Undo" bar, shown once right after a dose was logged (home or Today's doses).
   Needs: undo (from _undo_once()) and back_page ("dashboard" / "today"). #}
{% if undo %}
<div class="alert alert-success d-flex flex-wrap align-items-center justify-content-between gap-2" role="status">
  <div class="d-flex align-items-center gap-2">
    <i class="bi bi-check-circle-fill fs-5" aria-hidden="true"></i> {{ undo.message }}
  </div>
  <form method="post" action="{{ url_for('patient.undo_dose') }}" class="m-0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ back_page }}">
    <button type="submit" class="btn btn-outline-success"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Undo</button>
  </form>
</div>
{% endif %}
