{% extends "base.html" %}
{% block content %}
<h2>Patient sign up</h2>
<div class="card" style="max-width:380px;">
  <form method="post">
    <div class="field"><label>Name</label><input name="name" required></div>
    <div class="field"><label>Email</label><input type="email" name="email" required></div>
    <div class="field"><label>Password</label><input type="password" name="password" minlength="8" required></div>
    <div class="field"><label>Confirm password</label><input type="password" name="confirm_password" minlength="8" required></div>
    <p class="muted">At least 8 characters, including a letter and a number.</p>
    <div class="field"><label>Date of birth</label><input type="date" name="date_of_birth" required></div>
    <button type="submit">Sign up</button>
  </form>
</div>
{% endblock %}
