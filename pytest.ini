[pytest]
testpaths = tests
# so tests can `import app`, `import config` (project folder) and `from conftest import ...` (tests/)
pythonpath = . tests
# datetime.utcnow() is used on purpose (all timestamps are naive UTC); hide its deprecation noise
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
